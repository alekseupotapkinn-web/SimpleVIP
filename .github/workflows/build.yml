name: Build SimpleVIP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: |
          mkdir -p release
          cp bin/Release/net10.0/SimpleVIP.dll release/
          cp bin/Release/net10.0/SimpleVIP.deps.json release/ || true
          cp bin/Release/net10.0/SimpleVIP.pdb release/ || true

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SimpleVIP
          path: release/
